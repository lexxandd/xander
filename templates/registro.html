{% extends "base.html" %}
{% block titulo %}Crear cuenta{% endblock %}

{% block contenido %}
<section class="seccion seccion-angosta seccion-auth">
    <p class="eyebrow"># registro</p>
    <h1>Únete a la comunidad</h1>

    <form method="POST" class="formulario">
        <label for="nombre_usuario">Usuario</label>
        <input type="text" id="nombre_usuario" name="nombre_usuario" required autofocus>

        <label for="email">Correo</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>

        <label for="distro_favorita">Distro favorita o que te gustaría probar (opcional)</label>
        <input type="text" id="distro_favorita" name="distro_favorita" placeholder="ej. Ubuntu, Mint, Fedora...">

        <button type="submit" class="boton boton-primario">Crear cuenta</button>
    </form>

    <p class="auth-alterna">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
</section>
{% endblock %}
